name: Spring Boot CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Application
      run: ./mvnw clean compile

    - name: Run Unit Tests
      run: ./mvnw test

    - name: Run Integration Tests
      run: ./mvnw verify -DskipUnitTests
